name: "Docker image: Python updateloop"

on:
  push:
    branches: [master]
    tags: ["v**"]
    paths:
      - "apps/updateloop/**"
      - ".github/workflows/docker-image-updateloop.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/updateloop/**"
      - ".github/workflows/docker-image-updateloop.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/updateloop
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.26"
          python-version: "3.14"
          working-directory: apps/updateloop
          enable-cache: true

      - run: uv sync --locked --group dev

      - run: uv run --no-sync ruff check .

      - run: uv run --no-sync pytest

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/updateloop
          file: apps/updateloop/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/flandia/arkwaifu/updateloop:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/flandia/arkwaifu/updateloop:latest' || '' }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/flandia/arkwaifu/updateloop:{0}', github.ref_name) || '' }}
