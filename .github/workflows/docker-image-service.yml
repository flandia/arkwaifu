name: "Docker image: OCaml service"

on:
  push:
    branches: [master]
    tags: ["v**"]
    paths:
      - "apps/service/**"
      - "apps/updateloop/src/arkwaifu.sql"
      - ".github/workflows/docker-image-service.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/service/**"
      - "apps/updateloop/src/arkwaifu.sql"
      - ".github/workflows/docker-image-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: apps/service
          file: apps/service/Dockerfile
          target: contract-test
          build-contexts: |
            database-schema=apps/updateloop/src
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/service
          file: apps/service/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/flandia/arkwaifu/service:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/flandia/arkwaifu/service:latest' || '' }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/flandia/arkwaifu/service:{0}', github.ref_name) || '' }}
