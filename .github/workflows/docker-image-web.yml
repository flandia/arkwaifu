name: "Docker image: React web"

on:
  push:
    branches: [master]
    tags: ["v**"]
    paths:
      - "apps/web/**"
      - "assets/**"
      - ".github/workflows/docker-image-web.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/web/**"
      - "assets/**"
      - ".github/workflows/docker-image-web.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/.bun-version

      - run: bun ci

      - run: bun run lint

      - run: bun run format:check

      - run: bun test

      - run: bun run build

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ghcr.io/flandia/arkwaifu/web:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/flandia/arkwaifu/web:latest' || '' }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/flandia/arkwaifu/web:{0}', github.ref_name) || '' }}
