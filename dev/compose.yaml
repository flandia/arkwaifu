name: arkwaifu-dev

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arkwaifu
      MINIO_ROOT_PASSWORD: arkwaifu-dev-secret
      MC_HOST_local: http://arkwaifu:arkwaifu-dev-secret@localhost:9000
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 arkwaifu arkwaifu-dev-secret &&
        mc mb --ignore-existing local/arkwaifu &&
        mc version suspend local/arkwaifu &&
        mc anonymous set download local/arkwaifu

volumes:
  minio-data:
