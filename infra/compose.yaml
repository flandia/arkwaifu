name: arkwaifu-dev

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arkwaifu
      MINIO_ROOT_PASSWORD: arkwaifu-dev-secret
      MC_HOST_local: http://arkwaifu:arkwaifu-dev-secret@localhost:9000
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 arkwaifu arkwaifu-dev-secret &&
        mc mb --ignore-existing local/arkwaifu &&
        mc version enable local/arkwaifu &&
        mc anonymous set download local/arkwaifu

  service:
    profiles: [service]
    build:
      context: ../apps/service
    environment:
      ARKWAIFU_OBJECT_BASE_URL: http://127.0.0.1:59000/arkwaifu
      ARKWAIFU_DATABASE_URL: http://minio:9000/arkwaifu/arkwaifu.sqlite3
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - service-database:/var/lib/arkwaifu/database
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  service-database:
